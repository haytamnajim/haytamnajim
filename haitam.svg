<svg
  width="1200"
  height="190"
  viewBox="0 0 1200 190"
  xmlns="http://www.w3.org/2000/svg"
>

  <!-- Background -->
  <rect width="1200" height="190" fill="#0d1117"/>

  <!-- GitHub contribution grid -->
  <defs>
    <pattern
      id="grid"
      width="20"
      height="20"
      patternUnits="userSpaceOnUse"
    >
      <rect
        x="0"
        y="0"
        width="15"
        height="15"
        rx="2"
        fill="#161b22"
      />
    </pattern>
  </defs>

  <rect
    x="20"
    y="20"
    width="1100"
    height="140"
    fill="url(#grid)"
  />

  <!-- ================================================= -->
  <!-- HAITAM -->
  <!-- Every square = 15x15 with 5px spacing -->
  <!-- ================================================= -->

  <g fill="#39d353">

